name: Karbon Regulatory Posture
description: >-
  Regulatory signals from Karbon, Inc.'s own legal and trust pages: the Privacy Policy (https://karbonhq.com/privacy-policy/, HTTP 200),
  the Terms of Use (https://karbonhq.com/terms/, HTTP 200, redirects to https://karbonhq.com/terms-of-use) and the Enterprise Security page
  (https://karbonhq.com/security/, HTTP 200). The security page describes an internal incident-management process but makes no
  customer notification commitment, so incident_notification is not recorded. The privacy policy says Personal Data is shared with
  third party service providers but publishes no subprocessor list. No data-residency (region) commitment, Global Privacy Control,
  accessibility statement, transparency report or SBOM language was found on the pages read.
