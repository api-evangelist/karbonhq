aid: karbonhq

name: Karbon

description: Karbon is accounting practice management software for accounting firms, built to enhance visibility, efficiency, and connectivity
  for a firm no matter where its people are located. Through the Karbon Developer Center (developers.karbonhq.com) it publishes a public REST
  API reference plus guides covering authentication, pagination, rate limits, webhooks, work items, clients, custom fields, budgets and time,
  invoices and payments, and file uploads.

