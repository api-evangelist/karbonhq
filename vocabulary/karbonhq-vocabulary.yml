    tags:
    - Resource Group
    source: openapi/karbonhq-openapi.yml
  - term: Integrated Workflows
    definition: Endpoints that enable Karbon Integration Partners to manage integrated workflow tasks enabled for their integrations. Note that
      these endpoints cannot be used to access Tasks or Client Tasks. Access is limited to approved developers building apps that serve all Karbon
      customers.
    tags:
    - Resource Group
    source: openapi/karbonhq-openapi.yml
  - term: Organizations
    definition: Create an organization to represent marriages and couples and client groups to represent families. [Read more](https://help.karbonhq.com/en/articles/5708609-overview-of-contacts#h_8ee87bfcc1)
    tags:
    - Resource Group
    source: openapi/karbonhq-openapi.yml
  - term: Notes
