    tags:
    - Resource Group
    source: openapi/karbonhq-openapi.yml
  - term: Users
    definition: Create and view the basics & defaults for colleagues, teams and job roles to customize Karbon to represent the way you and your
      team work. [Read more](https://help.karbonhq.com/en/articles/3731216-edit-your-user-profile)
    tags:
    - Resource Group
    source: openapi/karbonhq-openapi.yml
  - term: Webhook Payloads
    definition: Details of the different payloads sent for Karbon Webhook subscriptions
    tags:
    - Resource Group
    source: openapi/karbonhq-openapi.yml
  - term: Webhook Subscriptions
    definition: 'Integrate your system with Karbon to receive changes made to your data in Karbon. Note: Webhook payloads take the following form:
      ```JSON { "ResourcePermaKey": "{EntityKey}", "ResourceType": "{EntityType}", "ActionType": "{ActionType}" "TimeStamp": "{YYYY-MM-DDTHH:mm:ssZ}"
      } ```'
    tags:
    - Resource Group
    source: openapi/karbonhq-openapi.yml
  - term: Work Items
    definition: Manage a Work Item to best fit your workflow, including timelines, tasks and work teams. [Read more](https://help.karbonhq.com/en/articles/6057036-managing-work-items-and-teams)
    tags:
    - Resource Group
    source: openapi/karbonhq-openapi.yml
  - term: Work Schedules
