    tags:
    - Resource Group
    source: openapi/karbonhq-openapi.yml
  - term: Tenant Settings
    definition: Retrieve lists of valid Contact Types, Work Types and Work Statuses
    tags:
    - Resource Group
    source: openapi/karbonhq-openapi.yml
  - term: Timesheets and Time Entries
    definition: Retrieve individual (non-aggregated) time entries, each record represents a single time entry for a specific day, user, and work
      item. [Read more](https://help.karbonhq.com/en/s/articles/6022358-managing-time-budgets-and-expenses-in-karbon). **Deprecated** Review Time
