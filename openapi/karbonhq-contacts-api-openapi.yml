  /v3/Contacts/{Contactkey}:
    get:
      tags:
      - Contacts
      summary: Gets a Contact using Contactkey
      parameters:
      - required: true
        in: path
        name: Contactkey
        schema:
          type: string
        example: 4jgPTtcXxwC2
        description: The Karbon-generated Contact key
      - in: query
        name: $expand
        schema:
          type: string
          enum:
          - BusinessCards
          - ClientTeam
          - ClientAccess
          - ServiceTypes
        example: BusinessCards
        description: 'When this parameter is combined with the URI, this endpoint will also return one or more of the following: Business Cards for the Contact, the Client Team assigned to the Contact, a list of other Contacts that can access this Contact in Karbon for Clients, or the Service Types assigned to the Contact.'
      description: 'Use the `GET` method on this endpoint to receive the details of a Contact specified using the `Contactkey`.


        Using the query parameter available to this endpoint, you can also include the Business Card details of the Contacts in the response.'
      operationId: getContactByID
      responses:
        '200':
          description: Successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResponseCreateContact'
