openapi: 3.2.0
info:
  description: '> 📖 **Agent/developer quick-reference:** See KARBON_API.md in this repository.'
  version: v3
  title: Karbon Contacts API
  termsOfService: https://karbonhq.com/terms-of-use/
  contact:
    name: API Support
    url: https://developers.karbonhq.com/issues/
  license:
    name: Apache 2.0
    url: http://www.apache.org/licenses/LICENSE-2.0.html
servers:
- url: https://api.karbonhq.com
  description: The production API server
security:
- ApiKeyAuth: []
  BearerAuth: []
tags:
- name: Contacts
  description: Manage your contacts and get the full overview over clients, whether they are individuals or organizations. Read more
paths:
  /v3/Contacts:
    get:
      tags:
      - Contacts
      summary: Gets a list of Contacts
      parameters:
      - in: query
        name: $filter
        schema:
          type: string
        examples:
          FullName:
            value: FullName eq 'Sample Management Team
            summary: Return only the Contacts where the Full Name matches 'Sample Client Team'
          EmailAddress:
            value: EmailAddress eq 'karbon@example.com'
            summary: Return only the Contacts where the Email Address matches 'karbon@example.com'
          PhoneNumber:
            value: PhoneNumber eq '220114588'
            summary: Return only the Contacts where the Phone Number matches '220114588'
          ContactType:
            value: ContactType eq 'Client'
            summary: Return only the Contacts where the Contact Type matches 'Client'
          externalKey:
            value: ExternalKey eq '123987456'
            summary: Return only the Contacts whose ExternalKey matches '123987456'. ExternalKey is the identifier from an integrated external system - XPM Client ID, Xero Contact ID, or QuickBooks Online Intuit Customer ID. Only the eq operator is supported.
        description: 'When this parameter is combined with the URI, this endpoint will return a subset of the Contacts that satisfy the `$filter` expression.

          '
      - in: query
        name: $orderby
        schema:
          type: string
          enum:
          - FullName
          - FullName desc
          - LastModifiedDateTime
          - LastModifiedDateTime desc
          default: ClientGroupKey
        example: FullName
        description: 'When this parameter is combined with the URI, this endpoint will return a list of Contacts, sorted by the available properties.

          '
      - $ref: '#/components/parameters/SkipRecords'
      - $ref: '#/components/parameters/TopRecords'
      description: 'Use the `GET` method on this endpoint to receive a paginated list of Contacts from your tenant. Using the query parameters available to this endpoint, you can also filter the list of Contacts by their full name, email address, or phone number.


        **Notes**


        This endpoint returns a maximum of 100 Contacts at once.


        If the query results in more than 100 Contacts, a link to the next set of the results will be given in the `@odata.nextLink` field of the response.


        The `$filter` query parameter supports 3 logical operators (`eq`, `contains`, and `and`) and 3 properties to help you form an expression. Usage examples below


        Logical Operators

        Purpose

        FullName

        EmailAddress

        PhoneNumber


        eq

        Full-text search

        /v3/Contacts?$filter=FullName eq ''Sample Management

        Team''

        /v3/Contacts?$filter=EmailAddress eq

        ''sample@company.com''

        /v3/Contacts?$filter=PhoneNumber eq

        ''1234567890''


        contains

        Partial-text search

        /v3/Contacts?$filter=(contains(FullName, ''Management

        Team''))

        /v3/Contacts?$filter=(contains(EmailAddress,

        ''sample@''))

        /v3/Contacts?$filter=(contains(PhoneNumber,

        ''45678''))


        and

        Combines properties

        /v3/Contacts?$filter=PhoneNumber eq

        ''1234567890'' and contains(FullName, ''Management Team'')'
      operationId: getAllContacts
      responses:
        '200':
          description: Successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetContacts'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorMessages'
              examples:
                Unsupported Property:
                  $ref: '#/components/examples/Unsupported_Property_Filter'
                Unsupported Orderby Property:
                  $ref: '#/components/examples/Orderby_Unsupported_Property'
                $top limit exceeded:
                  $ref: '#/components/examples/Limit_Exceeded_Top'
                Unsupported Option:
                  $ref: '#/components/examples/Unsupported_option'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResourceNotFound'
              examples:
                Unauthorized Access:
                  $ref: '#/components/examples/UnauthorizedAccess'
        '429':
          description: Rate Limit Exceeded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RateLimitErrorMessage'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorMessages'
              examples:
                Undefined Error:
                  $ref: '#/components/examples/elongated_5001'
    post:
      tags:
      - Contacts
      summary: Creates a new Contact
      description: Use the `POST` method on this endpoint to create a new Contact in your tenant.
      operationId: createContact
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResponseCreateContact'
              example:
                '@odata.context': https://api.karbonhq.com/v3/$metadata#Contacts/KarbonService.ContactDTO/$entity
                '@odata.type': '#KarbonService.ContactDTO'
                ContactKey: 67zlxNyJSr8e
                FirstName: William
                MiddleName: John
