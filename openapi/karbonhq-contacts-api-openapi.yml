                  OrganizationValuation: null
                  PaysTax: null
                  PrepareGST: null
                  ProvisionalTaxBasic: null
                  ProvisionalTaxRatio: null
                  RevenueModel: null
                  SalesTaxBasis: null
                  SalesTaxPeriod: null
                  Sells: null
                  RegistrationNumbers:
                  - RegistrationNumber: 12-3456789
                    Type: Social Security Number (SSN)
                  Notes:
                  - Body: This is a sample note text.
                    Type: Basic
                BusinessCards:
                - BusinessCardKey: 2tBHyXtJBxBy
