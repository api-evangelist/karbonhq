    put:
      tags:
      - Contacts
      summary: Updates a Contact (Full)
      parameters:
      - required: true
        in: path
        name: Contactkey
        schema:
          type: string
        example: 4t8LbR1QcbGS
        description: The Karbon-generated Contact key
      description: 'Use the `PUT` method on this endpoint to update full details of a Contact specified using the `Contactkey`.


        Using the query parameter `$expand` with this endpoint, you can also update the Business Card details of the Contact.


        **Note:** When updating business cards, you must include `BusinessCardKey`, `EntityType` and `EntityKey` properties for existing Business Cards - or the existing card and any associated Client Requests may be removed.


        **BusinessCards is optional:** If the `BusinessCards` array is omitted from the request body, the existing Business Cards on the Contact are left untouched. Include the `BusinessCards` array only when you intend to update it.


        **RegistrationNumber null/empty values delete the entry:** If a `RegistrationNumbers` entry is included with a null, empty, or whitespace `RegistrationNumber` value, any existing registration number of that `Type` is deleted. If no entry exists for that `Type`, the request is a no-op. Non-blank values continue to upsert as before.'
      operationId: putContactByID
      responses:
        '204':
          description: No Content
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorMessages'
              examples:
                Incorrect or Missing Data:
                  $ref: '#/components/examples/Missing_Update_Data'
                Unsupported Option:
                  $ref: '#/components/examples/Unsupported_option'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResourceNotFound'
              examples:
                Unauthorized Access:
                  $ref: '#/components/examples/UnauthorizedAccess'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorMessages'
              examples:
                Permission Denied:
                  $ref: '#/components/examples/RestrictionLevel_Permission_Denied'
        '404':
          description: Resource Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResourceNotFound'
              examples:
                Key Not Found:
                  $ref: '#/components/examples/ResourceNotFound'
        '429':
          description: Rate Limit Exceeded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RateLimitErrorMessage'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorMessages'
              examples:
                Non existent Key:
                  $ref: '#/components/examples/Shortened_5001'
                Undefined Error:
                  $ref: '#/components/examples/elongated_5001'
        '409':
          description: Conflict — the resource was modified by another request. Refetch the latest version and retry.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorMessages'
              examples:
                Stale Object State:
                  $ref: '#/components/examples/Conflict_StaleObjectState'
      requestBody:
        description: Refer to the table below for more information on each field in the request body.
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateContact'
    patch:
      tags:
      - Contacts
      summary: Updates a Contact (Partial)
      parameters:
      - required: true
        in: path
        name: Contactkey
        schema:
          type: string
        example: 4t8LbR1QcbGS
        description: The Karbon-generated Contact key
      description: 'Use the `PATCH` method on this endpoint to update partial details of a Contact specified using the `Contactkey`.


        This method **only supports** editing the `FirstName`, `MiddleName`, `LastName`, `PreferredName`, `Salutation`, `Suffix` and `RestrictionLevel` properties.'
      operationId: patchContactsByID
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  '@odata.context':
                    type: string
                    description: The information about Karbon controllers generating this response.
                  '@odata.type':
                    type: string
                    description: The information about Karbon Objects generating this response.
                  ContactKey:
                    type: string
                    description: A Karbon-generated value that is used to identify the Contact
                  FirstName:
                    type: string
                    description: The first name of the Contact
                  MiddleName:
                    type: string
                    description: The middle name of the Contact
                  LastName:
                    type: string
                    description: The last name of the Contact
                  PreferredName:
                    type: string
                    description: The preferred name of the Contact
                  Salutation:
                    type: string
                    description: The title to address the Contact
                  Suffix:
                    type: string
                    description: The suffix of the Contact
                  ClientOwner:
                    type: string
                    description: The team member in your firm who looks after client relationship or is responsible for the vast majority of the work of the Contact. You can only use the UserKey or the email address of an existing team member.
