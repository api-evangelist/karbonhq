        in: path
        required: true
        description: The Karbon-generated Organization key
        schema:
          type: string
        example: 2Nw8tnxwQCVf
      - in: query
        name: $expand
        schema:
          type: string
        examples:
          BusinessCards:
            value: BusinessCards
            summary: Include the Business Card for the Organization the API response
          ClientTeam:
            value: ClientTeam
            summary: Include the Client Team assigned to the Organization in the API response
          Contacts:
            value: Contacts
            summary: Include the Contacts related to the Organization in the API response
          ServiceTypes:
            value: ServiceTypes
            summary: Include the Service Types assigned to the Organization in the API response
          BusinessCardAndClientTeam:
            value: BusinessCard,ClientTeam
            summary: Include the Business Card and the Client Team assigned to the Organization in the API response
        description: 'When this parameter is combined with the URI, this endpoint will also return Business Cards, Client Team, Contacts and/or Service Types associated with the Organization. Multiple properties can be returned by specifying a comma separated list.

          '
      description: 'Use the `GET` method on this endpoint to receive the details of an Organization specified using the `Organizationkey`.


        Using the query parameter available to this endpoint, you can also include the Business Card details of the Organization in the response.'
