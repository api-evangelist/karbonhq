    put:
      tags:
      - Organizations
      summary: Updates an Organization (Full)
      parameters:
      - required: true
        in: path
        name: Organizationkey
        schema:
          type: string
        example: 2Nw8tnxwQCVf
        description: The Karbon-generated Organization key
      description: 'Use the `PUT` method on this endpoint to update full details of an Organization specified using the `Organizationkey`.


        Using the query parameter `$expand` with this endpoint, you can also update the Business Card details of the Organization.


        **Note:** When updating business cards, you must include `BusinessCardKey`, `EntityType` and `EntityKey` properties for existing Business Cards - or the existing card and any associated Client Requests may be removed.


        **BusinessCards is optional:** If the `BusinessCards` array is omitted from the request body, the existing Business Cards on the Organization are left untouched. Include the `BusinessCards` array only when you intend to update it.


        **RegistrationNumber null/empty values delete the entry:** If a `RegistrationNumbers` entry is included with a null, empty, or whitespace `RegistrationNumber` value, any existing registration number of that `Type` is deleted. If no entry exists for that `Type`, the request is a no-op. Non-blank values continue to upsert as before.'
      operationId: putOrganizationByID
      responses:
        '204':
          description: No Content
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorMessages'
              examples:
                Incorrect or Missing Data:
                  $ref: '#/components/examples/Missing_Update_Data'
                Unsupported Option:
                  $ref: '#/components/examples/Unsupported_option'
        '401':
