openapi: 3.2.0
info:
  title: Karbonhq Organizations API
  version: v3
  contact:
    name: API Support
    url: https://developers.karbonhq.com/issues/
  license:
    name: Apache 2.0
    url: http://www.apache.org/licenses/LICENSE-2.0.html
  termsOfService: https://karbonhq.com/terms-of-use/
  description: 'Operations tagged Organizations across 2 of this provider''s published API definitions: KarbonAPI.json, karbonhq-openapi.yml. Each path carries the servers of the definition it was published in.'
servers:
- url: https://api.karbonhq.com
  description: The production API server
security:
- ApiKeyAuth: []
  BearerAuth: []
tags:
- name: Organizations
  description: Create an organization to represent marriages and couples and client groups to represent families. Read more
paths:
  /v3/Organizations:
    get:
      tags:
      - Organizations
      summary: Gets a list of Organizations
      parameters:
      - in: query
        name: $filter
        schema:
          type: string
        examples:
          fullName:
            value: FullName eq 'Sample Company'
            summary: The full name of the organization equals 'Sample Company'
          emailAddress:
            value: EmailAddress eq 'karbon@example.com'
            summary: The email address of the organization equals 'karbon@example.com'
          contactTypeEquals:
            value: ContactType eq 'Prospect'
            summary: The ContactType of the organization equals 'Prospect'
          contactTypeContains:
            value: contains(ContactType, 'Client')
            summary: The ContactType of the organization contains 'Client', would return Organizations with the ContactType 'Client', 'Client - VIP' and 'Inactive Client'
          externalKey:
            value: ExternalKey eq '123987456'
            summary: The ExternalKey of the organization equals '123987456'. ExternalKey is the identifier from an integrated external system - XPM Client ID, Xero Contact ID, or QuickBooks Online Intuit Customer ID.
        description: When this parameter is combined with the URI, this endpoint will return a subset of the Organizations that satisfy the `$filter` expression.
      - in: query
        name: $orderby
        schema:
          type: string
          enum:
          - FullName
          - FullName desc
          - LastModifiedDateTime
          - LastModifiedDateTime desc
          default: OrganizationKey
        example: FullName
        description: 'When this parameter is combined with the URI, this endpoint will return a list of Organizations, sorted by the available properties.

          '
      - $ref: '#/components/parameters/SkipRecords'
      - $ref: '#/components/parameters/TopRecords'
      description: 'Use the `GET` method on this endpoint to receive a paginated list of Organizations from your tenant. Using the query parameters available to this endpoint, you can also filter the list of Organizations by their full name, email address, or external key.


        **Notes**


        * This endpoint returns a maximum of 100 Organizations at once.

        * If the query results in more than 100 Organizations, a link to the next set of the results will be given in the `@odata.nextLink` field of the response.

        * The `$filter` query parameter supports 2 logical operators - `eq` and `and` - and 3 properties to help you form an expression. Usage examples below


        Logical Operators

        Purpose

        FullName

        EmailAddress

        ExternalKey


        eq

        Full-text search

        /v3/Organizations?$filter=FullName eq ''Sample Company''

        /v3/Organizations?$filter=EmailAddress eq ''info@samplecompany.com''

        /v3/Organizations?$filter=ExternalKey eq ''123987456''


        and

        Combines properties

        /v3/Organizations?$filter=FullName eq ''Sample Company'' and EmailAddress eq ''info@samplecompany.com'''
      operationId: getAllOrganizations
      responses:
        '200':
          description: Successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetOrganizations'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorMessages'
              examples:
                Unsupported Property:
                  $ref: '#/components/examples/Unsupported_Property_Filter'
                Unsupported Orderby Property:
                  $ref: '#/components/examples/Orderby_Unsupported_Property'
                $top limit exceeded:
                  $ref: '#/components/examples/Limit_Exceeded_Top'
                Unsupported Option:
                  $ref: '#/components/examples/Unsupported_option'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResourceNotFound'
              examples:
                Unauthorized Access:
                  $ref: '#/components/examples/UnauthorizedAccess'
        '429':
          description: Rate Limit Exceeded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RateLimitErrorMessage'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorMessages'
              examples:
                Undefined Error:
                  $ref: '#/components/examples/elongated_5001'
    post:
      tags:
      - Organizations
      summary: Creates a new Organization
      description: Use the `POST` method on this endpoint to create a new Organization in your tenant.
      operationId: createOrganization
